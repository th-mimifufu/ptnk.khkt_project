services:
  ml_api_dev:
    image: khanhlinh02/ml-service:latest
    container_name: ml_api_dev
    ports:
      - "8001:8000"
    env_file:
      - .env.dev
    restart: unless-stopped
    networks:
      - app-shared-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-shared-network:
    name: app-shared-network
