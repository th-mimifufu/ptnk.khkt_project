services:
  ml-api-staging:
    image: khanhlinh02/ml-service:latest
    env_file:
      - .env.staging
    networks:
      - app-shared-network-staging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    ports:
      - target: 8000
        published: 8002
        protocol: tcp
        mode: host

networks:
  app-shared-network-staging:
    driver: overlay
    external: true
    name: app-shared-network-staging